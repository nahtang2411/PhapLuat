                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 md:p-8">
                        <h2 class="text-2xl font-bold text-slate-800 mb-6 border-b border-slate-100 pb-4">Bài 7: Hàm chi phí và Tối đa hóa lợi nhuận (Cạnh tranh hoàn hảo)</h2>
                        
                        <div class="bg-slate-100 p-4 rounded-lg mb-6">
                            <p class="font-medium text-slate-800">Tổng chi phí: \\( TC = Q^2 + 2Q + 100 \\)</p>
                            <p class="text-sm text-slate-600">Thị trường cạnh tranh hoàn hảo: DN bán theo giá P cho trước.</p>
                        </div>

                        <div class="space-y-6">
                            <div class="bg-slate-50 p-5 rounded-lg border border-slate-200">
                                <h4 class="font-semibold text-blue-700 mb-3">a. Xác định các hàm số</h4>
                                <ul class="space-y-3 text-slate-700">
                                    <li><strong>Tổng doanh thu (TR):</strong> \\( TR = P \\cdot Q \\)</li>
                                    <li><strong>Doanh thu cận biên (MR):</strong> Vì P cố định, \\( MR = P \\)</li>
                                    <li><strong>Chi phí cận biên (MC):</strong> Đạo hàm của TC. \\( MC = (Q^2 + 2Q + 100)' = 2Q + 2 \\)</li>
                                    <li><strong>Chi phí cố định (FC):</strong> Hệ số tự do của TC. \\( FC = 100 \\)</li>
                                    <li><strong>Chi phí biến đổi (VC):</strong> Phần chứa Q. \\( VC = Q^2 + 2Q \\)</li>
                                    <li><strong>Chi phí biến đổi bình quân (AVC):</strong> \\( AVC = \\frac{VC}{Q} = Q + 2 \\)</li>
                                    <li><strong>Chi phí cố định bình quân (AFC):</strong> \\( AFC = \\frac{100}{Q} \\)</li>
                                    <li><strong>Tổng chi phí bình quân (ATC):</strong> \\( ATC = \\frac{TC}{Q} = Q + 2 + \\frac{100}{Q} \\)</li>
                                </ul>
                            </div>

                            <div class="bg-slate-50 p-5 rounded-lg border border-slate-200">

                if (newState) {
                    sidebar.classList.add('open');
                    sidebarOverlay.classList.remove('hidden');
                } else {
                    sidebar.classList.remove('open');
                    sidebarOverlay.classList.add('hidden');
                }
            }

            mobileMenuBtn.addEventListener('click', () => toggleMobileMenu());
            sidebarOverlay.addEventListener('click', () => toggleMobileMenu(false));
        });
    </script>
</body>
</html>
